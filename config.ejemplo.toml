# Configuración del exportador EVM.
# Este archivo se debe copiar como config.toml y ajustar a cada proyecto.
# Uso:  python evm_export.py generar --origen Programa.mpp --config config.toml
# Los valores de este archivo son los del programa. Todas las claves son
# opcionales: si se omite una clave, se usa el valor por defecto indicado en su
# comentario.

[campos]
# Campo de MS Project con el código EDT de cada tarea:
#   "WBS" (campo EDT de MS Project, por defecto), "OutlineNumber" (número de
#   esquema) o un campo personalizado de texto, por ejemplo "Text1" o su alias.
#   Si existe un campo personalizado con el alias "EDT", se usa ese campo; si no,
#   "EDT" equivale al campo EDT de MS Project.
# Las tareas sin código EDT no tienen fila propia en el libro.
# En este programa los códigos EDT están en el campo personalizado "Item EDT".
# Si se omite la clave, se usa "WBS".
edt = "Item EDT"

# Campo personalizado de texto con el método de medición del valor ganado
# (por ejemplo "Text10", o su alias "Método EVM"). Vacío = no se lee.
metodo = ""

# Campo numérico con el peso de cada hito (por ejemplo "Number1" o su alias
# "Peso hito"). Vacío = no se lee: los hitos no tienen valor propio y, en el
# método "Hitos ponderados", pesan igual.
# En el modo porcentaje, el peso es el % del BAC de la fila que se imputa en el
# mes del hito; el resto se reparte entre las tareas según su duración.
peso_hito = ""

# Campo de texto que decide, tarea por tarea, si tiene fila propia en el libro
# (por ejemplo "Text5", o su alias "Visible"; ver docs/calculo-pv.md):
#   "Sí" (Si, SI, S, X, 1)  fila propia, también por debajo de nivel_maximo (la
#                           tarea necesita código EDT)
#   "No" (NO, N, 0)         sin fila propia: la tarea y su rama se suman en la
#                           fila superior (su PV, EV y AC no se pierden)
#   vacío                   según nivel_maximo
# Si se omite la clave, se lee el campo con alias "Visible" cuando existe.
# Vacío ("") = no se lee.
# visible = "Visible"

[horizonte]
# Primer mes del horizonte (mes 1), formato "AAAA-MM".
# Vacío o sin la clave = mes en que comienza la línea base del proyecto.
mes_inicio = "2026-01"

# Cantidad de meses (columnas mensuales). 120 = 10 años.
meses = 120

[exportacion]
# Modo de cálculo del PV y del EV:
#   "porcentaje" (por defecto) MS Project no tiene importes: da el % planificado
#                y el % ganado de cada fila, por la duración de la línea base de
#                sus tareas y el peso de sus hitos. El BAC de cada fila se ingresa
#                en el libro (columna D de la hoja PV, o de PV-EmpresaA y
#                PV-EmpresaB) y el PV y el EV son el BAC × el %. El AC se carga
#                a mano.
#   "costo"      el PV y el BAC salen del costo de línea base de MS Project y el
#                AC del costo real (ver docs/presupuesto-bac.md).
modo = "porcentaje"

# Planificación a exportar: código EDT de alto nivel de la tarea que la contiene
# ("INTERNO" o "CLIENTE"). Se exportan solo las tareas que dependen de ella.
# Si se omite esta clave, se exportan todas las tareas del proyecto.
planificacion = "INTERNO"

# Nivel máximo del código EDT que se exporta (2.0.0 = nivel 1, 2.1.0 = nivel 2,
# 2.1.1 = nivel 3). Las tareas de nivel inferior se agregan (suman) en su
# elemento de este nivel.
nivel_maximo = 3

# Línea base que define el PV (sus fechas y, en el modo costo, su costo):
# 0 = "Línea base", 1..10 = "Línea base N".
# Si se omite, se usa la línea base que el proyecto tiene configurada para el
# valor acumulado (Archivo > Opciones > Avanzadas > Opciones de valor acumulado).
# linea_base = 0

# Completar los códigos EDT con ceros: "1" -> "1.0.0", "1.2" -> "1.2.0".
rellenar_edt = true

# Incluir tareas inactivas (MS Project 2010 o posterior).
incluir_inactivas = false

# Reparto en el tiempo de la duración de cada tarea (modo porcentaje) o, en el
# modo costo, de las tareas que no tienen distribución mensual de la línea base
# en MS Project (p. ej. costo de línea base escrito a mano):
#   "habiles"    proporcional al tiempo laborable del calendario
#   "calendario" proporcional a los días corridos
distribucion = "habiles"

# Feriados adicionales. Con XML se agregan al calendario del proyecto; con .mpp
# se usan para repartir la duración de las tareas (modo porcentaje) y en el
# reparto lineal (modo costo), con un calendario de lunes a viernes.
feriados = [
  # "2026-12-25",
  # "2027-01-01",
]

# Método asignado a las filas cuyo campo de método está vacío.
metodo_por_defecto = "Por definir"

# Moneda que se muestra en el libro (por defecto euro, "EUR").
# Vacío = código de moneda del proyecto en MS Project.
moneda = "EUR"

# Decimales en los montos del libro (0 a 4).
decimales = 0

# Título del informe (Cuadro de Mando y Resumen). Si se omite, se usa el nombre
# del proyecto en MS Project (con varios archivos, los nombres unidos con "+").
# titulo = "Programa de ejemplo"

# Depuración de costes (solo en el modo porcentaje; ver docs/depuracion-costes.md).
# Desactivada por defecto. Con depuracion_costes = true, el libro agrega la hoja
# PV-depuración, donde una empresa pega la previsión mensual de su plan de costes,
# y la hoja Depuración costes con el gráfico comparativo. En la hoja PV de esa
# empresa (PV-EmpresaA o PV-EmpresaB; PV en un libro de una sola empresa), cada
# fila lleva debajo su fila «(coste)» con esa previsión, para alinear las tareas
# e hitos de MS Project con ella. El libro de entrega se genera sin depuración,
# con --migrar-desde para conservar el BAC.
depuracion_costes = false

# Empresa que se depura en multi-empresa: el valor de empresa_a o empresa_b.
# Vacío o sin la clave = empresa_a.
depuracion_empresa = "EmpresaA"

# Indicador de alineamiento en las filas «(coste)»: diferencia de BAC y diferencia
# máxima acumulada entre las dos curvas, en % del BAC, y resaltado de los meses en
# que la diferencia acumulada supera depuracion_umbral (en % del BAC de la fila).
depuracion_alineamiento = false
depuracion_umbral = 10

[metodos]
# Valores del desplegable de la columna C (método de medición). Sin la clave se
# usa esta lista; en el modo costo incluye además "CPTR de MS Project".
# lista = [
#   "Por definir",
#   "0/100",
#   "50/50",
#   "25/75",
#   "20/80",
#   "Hitos ponderados",
#   "% Completado",
#   "% Físico completado",
#   "Unidades completadas",
#   "Avance lineal (LOE)",
# ]

[semaforo]
# Umbrales comunes de SPI y CPI (se muestran en el Cuadro de Mando):
#   rojo      si el índice es menor que "rojo_inferior" o mayor que "rojo_superior"
#   amarillo  si es menor que "amarillo_inferior" o mayor que "amarillo_superior"
#   verde     entre "amarillo_inferior" y "amarillo_superior" (inclusive)
# Los paquetes fuera del rango verde se listan en la hoja Análisis de desviaciones.
# Para no marcar los índices altos, se indican umbrales superiores altos (p. ej. 99).
rojo_inferior = 0.90
amarillo_inferior = 0.95
amarillo_superior = 1.05
rojo_superior = 1.10

[multiempresa]
# Reparto del PV, el EV y el AC entre dos empresas (ver docs/multiempresa.md).
# Desactivado por defecto. Con activar = true, el libro agrega las hojas de cada
# empresa (PV-EmpresaA, EV-EmpresaA, AC-EmpresaA y las de EmpresaB); las hojas
# PV, EV y AC son la suma de las dos empresas. En el modo porcentaje, el BAC de
# cada empresa se ingresa en su hoja PV y cada una tiene su % planificado y su %
# ganado, según las tareas en las que participa.
activar = false

# Campo de texto de MS Project con la empresa de cada tarea (por ejemplo "Text3",
# o su alias). Una tarea sin empresa hereda la de su tarea superior.
campo_empresa = "Empresa"

# Valores de la columna de empresa. Los nombres de las empresas se usan también
# en los nombres de las hojas: máximo 15 caracteres, sin [ ] : * ? / \ ni '.
empresa_a = "EmpresaA"
empresa_b = "EmpresaB"
ambas = "Ambas"

# Campo numérico con el % de la empresa A en las tareas "Ambas" (80 = 80 % para
# la empresa A y 20 % para la empresa B). En las demás tareas se ignora.
campo_reparto = "% Reparto"

# % de la empresa A cuando el campo de reparto está vacío, es 0 o está fuera de
# rango, y en las tareas sin empresa.
reparto_por_defecto = 50

# AC de cada empresa (solo en el modo costo; en el modo porcentaje siempre se
# carga a mano): false = se carga a mano en las hojas AC-EmpresaA y AC-EmpresaB;
# true = 'actualizar' lo carga desde MS Project (costo real de cada tarea
# repartido según su empresa).
ac_desde_project = false

# Varios archivos de MS Project en un mismo libro (ver docs/varios-archivos.md).
# Sin secciones [[proyectos]], el archivo se indica con --origen (un solo archivo).
# Con ellas, 'generar' y 'actualizar' leen todos los archivos y no se indica
# --origen. Los códigos EDT no se deben repetir entre archivos (por ejemplo,
# 1.0.0 a 8.0.0 en un archivo y 9.0.0 en otro). Una sección por archivo:
#   nombre        nombre corto y fijo del archivo en el libro (no se debe cambiar)
#   origen        archivo .mpp o .xml; las rutas relativas se toman desde la
#                 carpeta de este archivo de configuración
#   planificacion opcional: reemplaza [exportacion] planificacion ("" = todas)
#   linea_base    opcional: reemplaza [exportacion] linea_base
#
# [[proyectos]]
# nombre = "P1"
# origen = 'C:\Programa\Proyecto1.mpp'
#
# [[proyectos]]
# nombre = "P2"
# origen = 'C:\Programa\Proyecto2.mpp'
# planificacion = ""
