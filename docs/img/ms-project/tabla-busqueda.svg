<text x="45.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1</text>
<text x="66" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">0/100</text>
<text x="256" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Paquetes que empiezan y terminan en el mismo mes</text>
<text x="45.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2</text>
<text x="66" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">50/50</text>
<text x="256" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Paquetes de hasta 2 meses</text>
<text x="45.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3</text>
<text x="66" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">25/75</text>
<text x="256" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Hasta 2 meses, valor concentrado al final</text>
<text x="45.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">4</text>
<text x="66" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">20/80</text>
<text x="256" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Hasta 2 meses, valor concentrado al final</text>
<text x="45.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">5</text>
<text x="66" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Hitos ponderados</text>
<text x="256" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Paquetes largos: al menos un hito por mes</text>
<text x="45.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6</text>
<text x="66" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">% Completado</text>
<text x="256" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Avance por duración (% completado)</text>
<text x="45.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7</text>
<text x="66" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">% Físico completado</text>
<text x="256" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Avance físico medido (% físico completado)</text>
<text x="45.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">8</text>
<text x="66" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Unidades completadas</text>
<text x="256" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Unidades hechas / totales en % físico completado</text>
<text x="45.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="middle">9</text>
<text x="66" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Avance lineal (LOE)</text>
<text x="256" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Gestión y soporte: EV = PV</text>
